<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shopping Task</title><style>*{box-sizing:border-box}body{font:14px Arial;margin:0;padding-bottom:78px;color:#111}main,header{max-width:1150px;margin:auto;padding:14px}header{margin-top:14px;background:#f7f8f8;border:1px solid #ddd;border-radius:8px}h1{font-size:22px;margin:0 0 7px}header p{font-size:16px;margin:0}#status{font-weight:bold;margin:14px 0}#grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}article{border:1px solid #ddd;border-radius:8px;padding:11px;min-height:330px;display:flex;flex-direction:column}article.sel{outline:3px solid #067d62;background:#f3fbf8}.pic{height:180px;background-size:400% 600%;background-repeat:no-repeat;border-radius:5px}.t{line-height:1.35;min-height:55px;margin:9px 0}.price{font-size:21px;margin:3px 0 10px}button{font:inherit;cursor:pointer}.add{margin-top:auto;border:1px solid #fcd200;background:#ffd814;border-radius:18px;padding:8px}.sel .add{background:white;border-color:#888}.add:disabled{opacity:.45}nav{text-align:center;margin:24px}nav button{margin:3px;padding:7px 12px}footer{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #ccc;padding:12px}footer div{max-width:1150px;margin:auto;display:flex;justify-content:space-between;align-items:center}#go{padding:10px 22px;font-weight:bold;background:#f0c14b;border:1px solid #a88734;border-radius:7px}#go:disabled{background:#eee;color:#888}#msg{color:#b12704}@media(max-width:850px){#grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:620px){#grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:390px){#grid{grid-template-columns:1fr}}</style><header><h1>Shopping Task</h1><p>Please select seven products. Your selections will only be submitted after you click <b>Continue</b>.</p></header><main><div id="status">0 / 7 selected</div><div id="msg"></div><section id="grid"></section><nav><button id="b1">1</button><button id="b2">2</button><button id="next">Next &rsaquo;</button></nav></main><form id="f" method="post" hidden><input name="assignmentId" id="aid"><input name="workerId" id="wid"><input name="selected_items" id="items"><input name="selection_order" id="ord"><input name="selection_log" id="log"><input name="time_on_task_ms" id="tm"></form><footer><div><b id="bottom">0 of 7 products selected</b><button id="go" disabled>Continue</button></div></footer><script>const P=[["P01","Keyrose Emotional Support Dumpster Fire Crochet","$6.99"],["P02","Emotional Support Chicken Nuggets","$16.97"],["P03","MAMAGIFTREE Hand-Crocheted Rainbow Affirmation Purse","$9.99"],["P04","2Pcs Mini Night Light - Lonely Robot","$11.75"],["P05","8Pcs Cute Desk Accessories Miniature Resin Figurines","$6.99"],["P06","LAIX The Salaryman Eraser","$9.99"],["P07","Zugar Land Colorful Squeezable Smile Face Guy Phone Holders","$14.99"],["P08","Funny Pickleball Desk Companion","$29.99"],["P09","3D Printed Articulated Banana Decor","$8.99"],["P10","Mushroom Decor Statue","$9.99"],["P11","Handmade Positive Crochet Sunshine","$8.99"],["P12","Tian Zhun Dumpster Fire Zen Garden","$28.99"],["P13","Cute Flower Plush Doll Stuffed Plant Plushie","$21.86"],["P14","6 Pack Sports Ball Buddies","$12.99"],["P15","Whimsical Shaking Figurine Wooden Man","$15.99"],["P16","Chibi Campfire Night Light","$13.99"],["P17","Cute Desktop Trash Can Wastebasket","$12.99"],["P18","Natural Crystal Hedgehog Pet Rock","$22.99"],["P19","Cute Coffee Cup Figurine Holding a Coffee Cup","$15.00"],["P20","VHYHCY Cute Stuffed Boba Plush","$12.99"],["P21","Stelle Cute Softball Plush Keychain","$12.99"],["P22","Emotional Support Lattes","$13.93"],["P23","Linzy 6-inch 2-Pack Plantpals Plush Figure","$12.68"],["P24","WANIDEA Cute Chibi Flame Lamp","$12.99"]];(async()=>{let s='';for(let n of ['sprite.txt','sprite2.txt','sprite3.txt'])s+=(await fetch(n)).text();s='data:image/webp;base64,'+(await s).trim();let q=new URLSearchParams(location.search),a=q.get('assignmentId'),w=q.get('workerId')||'',u=q.get('turkSubmitTo'),preview=a==='ASSIGNMENT_ID_NOT_AVAILABLE',live=a&&u&&!preview,S=new Set,O=[],L=[],pg=1,t0=performance.now(),G=document.getElementById('grid'),st=document.getElementById('status'),go=document.getElementById('go');function upd(){st.textContent=S.size+' / 7 selected';bottom.textContent=S.size+' of 7 products selected';go.disabled=preview||S.size!==7}function draw(){G.innerHTML='';P.slice((pg-1)*12,pg*12).forEach((x,i)=>{let n=(pg-1)*12+i,r=Math.floor(n/4),c=n%4,xx=['0%','33.333%','66.667%','100%'][c],yy=['0%','20%','40%','60%','80%','100%'][r],e=document.createElement('article');e.className=S.has(x[0])?'sel':'';e.innerHTML=`<div class="pic" style="background-image:url(${s});background-position:${xx} ${yy}"></div><div class="t">${x[1]}</div><div class="price">${x[2]}</div>`;let b=document.createElement('button');b.className='add';b.textContent=S.has(x[0])?'Remove from cart':'Add to cart';b.disabled=preview||(!S.has(x[0])&&S.size>=7);b.onclick=()=>{if(S.has(x[0])){S.delete(x[0]);O.splice(O.indexOf(x[0]),1);L.push([x[0],'remove',Date.now()])}else if(S.size<7){S.add(x[0]);O.push(x[0]);L.push([x[0],'add',Date.now()])}draw()};e.appendChild(b);G.appendChild(e)});next.disabled=pg===2;upd()}function page(n){pg=n;draw();scrollTo(0,0)}b1.onclick=()=>page(1);b2.onclick=()=>page(2);next.onclick=()=>page(2);go.onclick=()=>{if(S.size!==7)return;aid.value=a||'';wid.value=w;items.value=O.join(',');ord.value=JSON.stringify(O);log.value=JSON.stringify(L);tm.value=Math.round(performance.now()-t0);if(live){f.action=new URL('/mturk/externalSubmit',u).href;f.submit()}else alert('Test submission: '+O.join(', '))};if(preview){msg.textContent='Please accept the HIT before making selections.'}else if(!live)msg.textContent='Test mode: selections will not be sent to MTurk.';draw()})().catch(()=>document.body.innerHTML='<p style="padding:24px">This study could not load. Please refresh.</p>');</script>
